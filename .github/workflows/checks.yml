name: Physics and browser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build and test dependencies
        run: |
          node --version
          python3 --version
          npm ci
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          npx playwright install --with-deps chromium
      - name: Rebuild committed pages
        run: |
          npm run build
          git diff --exit-code -- '*.html'
      - name: Verify physical models and controls
        run: |
          .venv/bin/python -m unittest -v test_model test_cosmology
          npm test
          npm run test:ui
